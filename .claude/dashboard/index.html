<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forzammilmod dashboard</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b18;--mute:#77746b;--line:#e4e1d8;--acc:#1f6f4a;--accbg:#e6f2ec;--warn:#b4491f}
@media(prefers-color-scheme:dark){:root{--bg:#131412;--card:#1b1c19;--ink:#ecebe5;--mute:#8d8b82;--line:#2b2c28;--acc:#5fc794;--accbg:#1a2b22;--warn:#e58a5f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
header{padding:20px 16px 16px;max-width:1200px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0;font-weight:600}
.cur{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:6px 0 12px}
.cur .id{color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;color:var(--mute);font-size:13px}
.warn{color:var(--warn)}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){main{grid-template-columns:2fr 1fr}}
.agents{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));align-content:start}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card{opacity:.6;transition:opacity .3s}
.card.on{opacity:1;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.name{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.on .dot{background:var(--acc);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
.ago{margin-left:auto;font-weight:400;font-size:12px;color:var(--mute)}
.st{margin:8px 0 6px;font-size:14px;min-height:1.4em}
.tool{font-size:12px;color:var(--acc);background:var(--accbg);border-radius:5px;padding:2px 6px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
ul{list-style:none;margin:0;padding:0}
.acts li{font-size:12px;color:var(--mute);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.side{display:grid;gap:16px;align-content:start}
.tasks li{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.tasks li:first-child{border-top:0}
.tasks .id{width:34px;color:var(--mute);flex:none}
.tasks .cur-t{font-weight:600}
.feed li{display:flex;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.feed .t{color:var(--mute);flex:none;width:56px}
.feed .a{flex:none;width:100px;color:var(--acc);overflow:hidden;text-overflow:ellipsis}
.feed .x{min-width:0;overflow-wrap:anywhere}
.feed .status .x{font-weight:600}
@media(max-width:480px){.feed .a{width:72px}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>forzammilmod / agents</h1><span class="meta" id="conn"></span></div>
  <div class="cur" id="cur">Loading…</div>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <div class="meta" id="meta"></div>
</header>
<main>
  <section class="agents" id="agents"></section>
  <div class="side">
    <section class="panel"><h2>Tasks</h2><ul class="tasks" id="tasks"></ul></section>
    <section class="panel"><h2>Activity</h2><ul class="feed" id="feed"></ul></section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=s=>s==null?'never':s<5?'now':s<60?s+'s ago':s<3600?Math.floor(s/60)+'m ago':Math.floor(s/3600)+'h ago';
const clock=t=>new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
function render(s){
  const p=s.progress,c=p.current;
  $('cur').innerHTML=c?`<span class="id mono">${esc(c.id)}</span> ${esc(c.title)}`:'No task in progress';
  $('bar').style.width=(p.total?p.done/p.total*100:0)+'%';
  $('meta').innerHTML=`<span>${p.done}/${p.total} done</span>`+p.gates.map(g=>`<span>${esc(g.id)} ${esc(g.state)}</span>`).join('')+
    (p.blockers.length?`<span class="warn">Blocked: ${esc(p.blockers.join('; '))}</span>`:'');
  $('agents').innerHTML=s.agents.map(a=>`<div class="card ${a.active?'on':''}">
    <div class="name"><span class="dot"></span>${esc(a.name)}<span class="ago">${esc(ago(a.ago))}</span></div>
    <div class="st">${esc(a.status||'No status yet')}</div>
    ${a.tool&&a.active?`<div class="tool mono">${esc(a.tool)}</div>`:''}
    <ul class="acts">${a.actions.map(x=>`<li title="${esc(x.text)}">${esc(x.text)}</li>`).join('')}</ul></div>`).join('');
  const list=[...(c?[c]:[]),...p.next];
  $('tasks').innerHTML=list.map(t=>`<li class="${t===c?'cur-t':''}"><span class="id mono">${esc(t.id)}</span><span>${esc(t.title)}</span></li>`).join('')||'<li>Nothing queued</li>';
  $('feed').innerHTML=s.feed.map(f=>`<li class="${f.kind}"><span class="t mono">${clock(f.t)}</span><span class="a">${esc(f.agent)}</span><span class="x">${esc(f.text)}</span></li>`).join('');
  $('conn').textContent='';
}
async function tick(){
  try{render(await (await fetch('/api/state')).json())}catch{$('conn').textContent='Disconnected'}
}
tick();setInterval(tick,1500);
</script>
</body>
</html>
