<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forzammilmod dashboard</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b18;--mute:#77746b;--line:#e4e1d8;--acc:#1f6f4a;--accbg:#e6f2ec;--warn:#b4491f;--you:#2f5f9e}
@media(prefers-color-scheme:dark){:root{--bg:#131412;--card:#1b1c19;--ink:#ecebe5;--mute:#8d8b82;--line:#2b2c28;--acc:#5fc794;--accbg:#1a2b22;--warn:#e58a5f;--you:#8fb4ea}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
header{padding:20px 16px 16px;max-width:1200px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0;font-weight:600}
.cur{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:6px 0 12px}
.cur .id{color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{position:relative;display:block;height:100%;background:var(--acc);border-radius:3px;overflow:hidden;transition:width .9s cubic-bezier(.22,.8,.2,1)}
.bar.live i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:sheen 2.4s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;color:var(--mute);font-size:13px}
#conn{transition:opacity .4s}
#conn:empty{opacity:0}
.warn{color:var(--warn)}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.agents{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-content:start}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card{opacity:.6;box-shadow:0 0 0 0 transparent inset,0 0 0 0 transparent;transition:opacity .5s,border-color .5s,box-shadow .5s,transform .5s cubic-bezier(.2,.7,.2,1)}
.card.on{opacity:1;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,0 0 0 0 transparent;animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1px var(--acc) inset,0 0 22px -6px var(--acc)}}
.name{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.name .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none;transition:background .5s}
.on .dot{background:var(--acc);animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.3;transform:scale(.75)}}
.ago{margin-left:auto;font-weight:400;font-size:12px;color:var(--mute);white-space:nowrap;flex:none}
.st{margin:8px 0 6px;font-size:15px;min-height:1.4em}
.dw{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s cubic-bezier(.2,.7,.2,1),opacity .4s}
.dw.show{grid-template-rows:1fr;opacity:1}
.dw>div{overflow:hidden;min-height:0}
.doing{font-size:13px;color:var(--acc);background:var(--accbg);border-radius:6px;padding:4px 8px;margin-bottom:8px}
ul{list-style:none;margin:0;padding:0}
.acts li{font-size:13px;color:var(--mute);padding:2px 0;overflow-wrap:anywhere}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.side{display:grid;gap:16px;align-content:start;min-width:0}
.tasks li{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px;transition:color .4s}
.tasks li:first-child{border-top:0}
.tasks .id{width:40px;color:var(--mute);flex:none}
.tasks .cur-t{font-weight:600}
.tasks .you{color:var(--you)}
.feed li{padding:7px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed .who{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--mute);white-space:nowrap}
.feed .who .a{color:var(--acc);overflow:hidden;text-overflow:ellipsis}
.feed .x{font-size:14px;margin-top:1px;overflow-wrap:anywhere}
.feed .status .x{font-weight:600}
.feed .you .who .a,.feed .you .x{color:var(--you)}
/* motion */
.enter{animation:enter .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(-8px)}}
.card.enter{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.card.on.enter{animation:rise .6s cubic-bezier(.2,.7,.2,1) both,glow 3s ease-in-out .6s infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.feed li.enter .x{animation:hl 2.2s ease-out}
@keyframes hl{from{color:var(--acc)}}
.swap{animation:swap .45s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(4px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>forzammilmod · what the agents are doing</h1><span class="meta" id="conn"></span></div>
  <div class="cur" id="cur">Loading…</div>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <div class="meta" id="meta"></div>
</header>
<main>
  <section class="agents" id="agents"></section>
  <div class="side">
    <section class="panel"><h2>Tasks</h2><ul class="tasks" id="tasks"></ul></section>
    <section class="panel"><h2>Activity</h2><ul class="feed" id="feed"></ul></section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=s=>s==null?'not used yet':s<5?'just now':s<60?s+'s ago':s<3600?Math.floor(s/60)+' min ago':Math.floor(s/3600)+' h ago';
const fmt=new Intl.DateTimeFormat('en-IE',{timeZone:'Europe/Dublin',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const clock=t=>fmt.format(new Date(t));
const forYou=t=>t.who==='egor';
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let first=true;
const calm=()=>first||RM.matches;
const mk=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e};
// Replay a short one-off animation class on an element.
function bump(e,cls='swap'){if(calm())return;e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls)}
function setText(e,t){if(e.textContent===t)return false;e.textContent=t;return true}
function setHTML(e,h){if(e.dataset.h===h)return false;e.dataset.h=h;e.innerHTML=h;return true}
// Keys that stay unique even when two items look the same.
function keys(items,keyOf){const seen={};return items.map(it=>{const k=keyOf(it);seen[k]=(seen[k]||0)+1;return k+'#'+seen[k]})}
// Update a list in place by key, then slide moved rows to their new spot (FLIP).
function sync(box,items,keyOf,build,update){
  const before=new Map([...box.children].map(c=>[c,c.getBoundingClientRect().top]));
  const old=new Map([...box.children].map(c=>[c.dataset.k,c]));
  const ks=keys(items,keyOf);let prev=null;
  items.forEach((it,i)=>{
    let n=old.get(ks[i]);
    if(n)old.delete(ks[i]);else{n=build(it,i);n.dataset.k=ks[i];if(!calm())n.classList.add('enter')}
    update(n,it,i);
    const want=prev?prev.nextSibling:box.firstChild;
    if(n!==want)box.insertBefore(n,want);
    prev=n;
  });
  for(const c of old.values())c.remove();
  if(calm())return;
  for(const c of box.children){const b=before.get(c);if(b==null)continue;const dy=b-c.getBoundingClientRect().top;
    if(Math.abs(dy)>1)c.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:420,easing:'cubic-bezier(.2,.7,.2,1)'})}
}
function cardBuild(a,i){
  const c=mk('div','card',`<div class="name"><span class="dot"></span><span class="lbl"></span><span class="ago"></span></div>
    <div class="st"></div><div class="dw"><div><div class="doing"></div></div></div><ul class="acts"></ul>`);
  if(first&&!RM.matches){c.classList.add('enter');c.style.animationDelay=i*70+'ms';c.addEventListener('animationend',()=>{c.style.animationDelay='';c.classList.remove('enter')},{once:true})}
  return c;
}
function cardUpdate(c,a){
  const st=a.status||(a.actions[0]&&a.actions[0].text)||'Hasn’t started anything yet';
  const now=a.tool&&a.active&&a.tool!==st?a.tool:null;
  const acts=a.actions.filter(x=>x.text!==st&&x.text!==now).slice(0,6);
  c.classList.toggle('on',!!a.active);
  setText(c.querySelector('.lbl'),a.label||a.name);
  setText(c.querySelector('.ago'),ago(a.ago));
  const stEl=c.querySelector('.st');if(setText(stEl,st))bump(stEl);
  const dw=c.querySelector('.dw'),doing=c.querySelector('.doing');
  if(now&&setText(doing,'Right now: '+now)&&dw.classList.contains('show'))bump(doing);
  dw.classList.toggle('show',!!now);
  sync(c.querySelector('.acts'),acts,x=>x.text,()=>mk('li'),(li,x)=>setText(li,x.text));
}
function render(s){
  const p=s.progress,c=p.current;
  const cur=$('cur');if(setHTML(cur,c?`<span class="id mono">${esc(c.id)}</span> ${esc(c.title)}`:'Nothing in progress'))bump(cur);
  $('bar').style.width=(p.total?p.done/p.total*100:0)+'%';
  $('bar').parentNode.classList.toggle('live',!!c);
  setHTML($('meta'),`<span>${p.done} of ${p.total} tasks done</span>`+p.gates.map(g=>`<span>${esc(g.id)}: ${esc(g.state)}</span>`).join('')+
    (p.blockers.length?`<span class="warn">Stuck: ${esc(p.blockers.join('; '))}</span>`:''));
  sync($('agents'),s.agents,a=>a.name,cardBuild,cardUpdate);
  const list=[...(c?[c]:[]),...p.next];
  sync($('tasks'),list.length?list:[null],t=>t?t.id:'-',()=>mk('li'),(li,t)=>{
    li.classList.toggle('cur-t',!!t&&t===c);li.classList.toggle('you',!!t&&forYou(t));
    setHTML(li,t?`<span class="id mono">${esc(t.id)}</span><span>${esc(t.title)}${forYou(t)?' (your turn)':''}</span>`:'Nothing queued')});
  sync($('feed'),s.feed,f=>f.t+'|'+f.agent+'|'+f.kind+'|'+f.text,f=>mk('li',esc(f.kind)),(li,f)=>
    setHTML(li,`<div class="who"><span class="t mono num">${clock(f.t)}</span><span class="a">${esc(f.kind==='you'?'You':(f.label||f.agent))}</span></div><div class="x">${esc(f.text)}</div>`));
  $('conn').textContent='';
  first=false;
}
async function tick(){
  try{render(await (await fetch('/api/state')).json())}catch{$('conn').textContent='Disconnected'}
}
tick();setInterval(tick,1500);
</script>
</body>
</html>
