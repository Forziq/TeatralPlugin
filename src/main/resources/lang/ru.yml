  perf-head: "&eНагрузка плагина - снарядов в воздухе: {shells} (пик {peak}), машин: {vehicles}, спит: {asleep}"
  perf-line: "&7{name}: в среднем {avg} мс, максимум {max} мс (за последние {n} тиков)"
  perf-total: "&aВ сумме в среднем {total} мс за тик (бюджет - 50 мс)"
