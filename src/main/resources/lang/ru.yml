help:
  header: "&6Команды forzammilmod:"
  cmd:
    help: "Показать этот список."
    guide: "Показать памятку ещё раз."
    emote-wave: "Помахать всем рукой."
    emote-greeting: "Показать эмоцию-приветствие."
    emote-stop: "Закончить эмоцию."
    music: "Общее радио: включить трек, выключить, перемешать, повторять, список треков."
    vehicle-list: "Список техники на сервере."
    vehicle-spawn: "Поставить технику туда, куда смотришь (только владелец)."
    vehicle-remove: "Убрать ближайшую технику (только владелец)."
    pack: "Проверить, загрузился ли ресурспак."
    version: "Версии плагина, ресурспака и BetterModel."
    update: "Скачать новую версию (только владелец)."
    reload: "Перечитать настройки (только владелец)."
guide:
  header: "&6&lКоротко о forzammilmod"
  emotes: "&eЭмоции: &7пиши &f/emote wave&7 или &f/emote {greeting}&7. Сделай шаг или напиши &f/emote stop&7, чтобы закончить."
  pads: "&eКак взять технику: &7найди площадку (командный блок с кнопкой) и нажми кнопку. Техника появится на 2 блока выше площадки. Нажми на неё правой кнопкой, чтобы сесть, присядь, чтобы выйти."
  car: "&eДжип и грузовик: &7W/S — ехать, A/D — поворачивать, Пробел — гудок. В джипе 3 места, в грузовике 8. Стрелять из них нельзя."
  tank: "&eТанк: &7водитель ездит на W/S и A/D (танк разворачивается на месте). Второе место — наводчик: целься взглядом, левая кнопка мыши — выстрел, перезарядка 4 секунды. Если наводчика нет, целится и стреляет водитель."
  gun: "&eПушка: &7садись за щиток. A/D медленно поворачивают пушку, взглядом вверх и вниз поднимаешь ствол, левая кнопка — выстрел (перезарядка 8 секунд). Сама она не ездит."
  plane: "&eСамолёт: &7W/S — газ, A/D — крен, Пробел — набор высоты, бег (Ctrl) — пикирование, левая кнопка — огонь из пулемётов. Присядь, чтобы выпрыгнуть с парашютом."
  repair: "&eРемонт: &7возьми железный слиток и нажми правой кнопкой на технику снаружи. Один слиток возвращает 10% прочности."
  radio: "&eРадио: &f/fmod music play <трек>&7, &fstop&7, &fshuffle&7, &floop&7, &flist&7. Музыку слышат все."
  footer: "&7Памятка снова: &f/fmod guide&7. Все команды: &f/fmod help&7."

