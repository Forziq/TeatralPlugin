version: "&7forzammilmod &fv{version}"
usage: "&eUsage: &f/{label} <{subs}>"
no-permission: "&cYou can't do that."
emote:
  started: "&7Emote started. Move to stop it."
  stopped: "&7Emote stopped."
  not-playing: "&7You're not doing an emote."
  unknown: "&cNo such emote."
  already-playing: "&cYou're already doing an emote. Use /emote stop first."
  unavailable: "&cEmotes aren't available right now."
  count:
    one: "&7{n} emote available."
    other: "&7{n} emotes available."
update:
  checking: "&7Checking for updates..."
  up-to-date: "&aAlready up to date (v{version})."
  downloaded: "&aDownloaded v{version}. Restart the server from exaroton to apply it."
  no-token: "&cNo GitHub token set in config.yml."
  error: "&cUpdate failed: {reason}"
players-only: "&cOnly players can use this."
pack:
  prompt: "The resource pack is required to play here."
  kick-declined: "&cYou need the resource pack to play here. Rejoin and accept it."
  kick-failed: "&cThe resource pack failed to download. Try rejoining."
  check-loaded: "&aYour game says the resource pack is loaded."
  check-loading: "&eThe resource pack is still downloading. Try again in a moment."
  check-unknown: "&eYour game hasn't reported the resource pack yet."
  check-failed: "&cThe resource pack didn't load. Try rejoining."
  check-off: "&cThis build has no resource pack set up."
  check-sound: "&7Playing a test sound: if you hear a cheer, the pack works. Silence means it doesn't."
music:
  usage: "&eUsage: &f/{label} music <play <track>|stop|shuffle|loop|list>"
  console: "Console"
  no-such-track: "&cNo such track. Pick one of these:"
  started: "&6♪ &f{actor} put on &e{name}"
  now-playing: "&6♪ Now playing &e{name}"
  stopped: "&6♪ &7{actor} turned the music off."
  shuffle-on: "&6♪ &7{actor} turned on shuffle."
  loop-on: "&6♪ &7Repeat is on ({actor})."
  loop-off: "&6♪ &7Repeat is off ({actor})."
  loop-nothing: "&cNothing is playing, so there's nothing to repeat."
  join: "&6♪ Now playing &e{name}&6. You'll hear the music from the next track."
  list-header:
    one: "&7{n} track:"
    other: "&7{n} tracks:"
  list-line: "&7- &f{name} &8({id})"
  list-playing: "&a▶ &f{name} &8({id})"
vehicle:
  usage: "&eUsage: &f/{label} vehicle <spawn <tank|jeep>|remove|list>"
  bad-type: "&cNo such vehicle. Pick tank or jeep."
  unavailable: "&cVehicles aren't available right now."
  model-missing: "&cThe {type} model isn't loaded. Check the server log."
  no-target: "&cLook at a block within 30 blocks to put the vehicle there."
  spawned: "&a{type} spawned."
  removed: "&7{type} removed."
  none-nearby: "&cNo vehicle within 10 blocks."
  has-driver: "&cThis vehicle already has a driver."
  not-ready: "&cThis vehicle isn't ready yet. Try again in a second."
  entered: "&7You're in the driver's seat. W/S to drive, A/D to turn, sneak to get out."
  pad-occupied: "&cThere's already a vehicle on the pad."
  pad-full: "&cToo many vehicles out ({max}). Get rid of one first."
  pad-arrived: "&a{type} has arrived."
  list-empty: "&7No vehicles out right now."
  list-header:
    one: "&7{n} vehicle:"
    other: "&7{n} vehicles:"
  list-line: "&7- &f{type} &8({world} {x} {y} {z})"
  name:
    tank: "Tank"
    jeep: "Jeep"
reload:
  seconds:
    one: "&eReloading: {n} second"
    other: "&eReloading: {n} seconds"
  ready: "&aReady to fire"
