# Optional. Updates download from the public GitHub repo without a token.
# A token only raises GitHub's rate limit; leave it empty unless checks start failing with 403.
github-token: ""

# Most vehicles that can be out on the server at once. Pads refuse above this. Minimum 1.
max-vehicles: 10

# Minutes a vehicle can stand with nobody driving before it disappears. 0 = never.
idle-despawn-minutes: 10

# The group's greeting emote. Change it here, then run /fmod reload on the server.
greeting:
  id: greeting            # what players type: /emote greeting (lowercase letters, digits, _)
  name: "Greeting"        # shown in English
  name-ru: "Приветствие"  # shown in Russian; blank = same as name
  sound: "forzammilmod:emote_whoosh"  # any sound key, vanilla or ours; blank = silent
  volume: 1.0             # more than 1 carries further than 16 blocks
  pitch: 1.0              # 0.5 to 2.0
